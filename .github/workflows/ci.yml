name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-browser:
    name: Studio in Windows Chrome and Edge
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e
      - name: Preserve separate client performance measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: client-performance-evidence
          path: tmp/phase10-client-*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: ripple
          POSTGRES_DB: ripple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripple -d ripple"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ripple:ripple@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: node tests/dependency-notices.ts --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - name: Check reproducible policy and studio scenarios
        run: npm run simulate -- --split held-out --rounds 36 --output /tmp/ripple-balance.json

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start the stack exactly as an evaluator would
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify readiness and the landing page
        run: |
          curl --fail --silent --show-error http://localhost:3000/health/ready
          curl --fail --silent --show-error http://localhost:3000/ | grep --quiet '<title>Ripple</title>'
      - name: Run a real synthetic round and connect to the scoped gateway
        run: docker compose exec -T app node apps/server/dist/cli/smoke-game.js
      - name: Verify preparation, raid, welcome, shelter and contest across two synthetic channels
        run: docker compose exec -T app node apps/server/dist/cli/smoke-raids.js
      - name: Verify earned mechanics, bounded expiry and scoped saved comparisons
        run: docker compose exec -T app node apps/server/dist/cli/smoke-mechanics.js
      - name: Verify a synthetic Cocoon Studio break, selection, review, hatch and raid
        run: docker compose exec -T app node apps/server/dist/cli/smoke-studio.js
      - name: Complete the keyless judge API journey in under three minutes
        run: docker compose exec -T app node apps/server/dist/cli/smoke-judge.js
      - name: Complete the actual installed browser journey without intercepted requests
        run: npm run test:judge
      - name: Rehearse a real dump, separate-database restore, erasure and deterministic replay
        env:
          TEST_DATABASE_URL: postgres://ripple:ripple@localhost:55432/postgres
        run: npm run test:restore
      - name: Preserve restore evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restore-evidence
          path: tmp/phase10-restore.json
          if-no-files-found: ignore
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  release-load:
    name: Release load on native Linux PostgreSQL (trial ${{ matrix.trial }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: ripple
          POSTGRES_DB: ripple
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ripple -d ripple"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ripple:ripple@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p tmp
      - name: Measure the complete declared server workload and enforce its targets
        run: npm run test:load -- --seconds 60 --channels 100 --strict --output tmp/phase10-ci-load.json
      - name: Preserve measured load evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-load-evidence-${{ matrix.trial }}
          path: tmp/phase10-ci-load.json
          if-no-files-found: ignore
